<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <title>Registration Form</title>

    <script src="app.js" defer></script>
</head>

<body>
    <main>
        <form id="registration-form" novalidate>
            <h2>Student Registration Form</h2>

            <div>
                <label for="name">Name:</label>
                <input id="name" name="name" type="text" required>
                <p id="name-error" class="error"></p>
            </div>

            <div>
                <label for="student-id">ID:</label>
                <input id="student-id" name="student-id" type="text" required>
                <p id="student-id-error" class="error"></p>
            </div>

            <div>
                <label for="email">Email:</label>
                <input id="email" name="email" type="email" required>
                <p id="email-error" class="error"></p>
            </div>

            <div>
                <span>Gender:</span>

                <input id="male" type="radio" name="gender" value="male">
                <label for="male">Male</label>

                <input id="female" type="radio" name="gender" value="female">
                <label for="female">Female</label>

                <p id="gender-error" class="error"></p>
            </div>

            <div>
                <label for="course">Course:</label>

                <select id="course" name="course" required>
                    <option value="">-- Select Option --</option>
                    <option value="aiml">AIML</option>
                    <option value="cse">CSE</option>
                    <option value="ce">CE</option>
                    <option value="it">IT</option>
                </select>

                <p id="course-error" class="error"></p>
            </div>

            <div>
                <label for="year">Year:</label>

                <select id="year" name="year" required>
                    <option value="">-- Select Year --</option>
                    <option value="1">First Year</option>
                    <option value="2">Second Year</option>
                    <option value="3">Third Year</option>
                    <option value="4">Fourth Year</option>
                </select>

                <p id="year-error" class="error"></p>
            </div>

            <div>
                <label for="mobile">Mobile No.:</label>
                <input id="mobile" name="mobile" type="tel" required>
                <p id="mobile-error" class="error"></p>
            </div>

            <div>
                <label for="birth-date">Birth Date:</label>
                <input id="birth-date" name="birth-date" type="date" required>
                <p id="birth-date-error" class="error"></p>
            </div>

            <div>
                <label for="password">Create Password:</label>
                <input id="password" name="password" type="password" required>

                <p id="password-strength"></p>
                <p id="password-error" class="error"></p>
            </div>

            <div>
                <label for="confirm-password">Confirm Password:</label>
                <input id="confirm-password" name="confirm-password" type="password" required>

                <p id="confirm-password-error" class="error"></p>
            </div>

            <div>
                <input id="terms" name="terms" type="checkbox">
                <label for="terms">I accept the terms and conditions</label>

                <p id="terms-error" class="error"></p>
            </div>

            <div>
                <button type="submit">Submit</button>
                <button type="reset">Clear</button>
            </div>
        </form>
    </main>
</body>
</html>
